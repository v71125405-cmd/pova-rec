
name: Build Pova Recorder APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Kotlin JVM target
        run: |
          cat > /tmp/kotlin-jvm.gradle <<'EOF'
          gradle.projectsEvaluated {
            rootProject.allprojects {
              tasks.configureEach { task ->
                if (task.name.toLowerCase().contains("kotlin")) {
                  if (task.hasProperty("kotlinOptions")) {
                    task.kotlinOptions.jvmTarget = "1.8"
                  }
                }
              }
            }
          }
          EOF

      - name: Extract source
        run: unzip PovaRecorder_Checked_Source.zip -d .

      - name: Build APK
        run: gradle -I /tmp/kotlin-jvm.gradle -p pova assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PovaRecorder-APK
          path: pova/app/build/outputs/apk/debug/app-debug.apk
