name: Build Pova Recorder APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip PovaRecorder_Checked_Source.zip -d .

      - name: Build APK
        run: gradle -p pova assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PovaRecorder-APK
          path: pova/app/build/outputs/apk/debug/app-debug.apk
